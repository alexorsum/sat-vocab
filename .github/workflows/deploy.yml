name: Deploy to GitHub Pages

# Builds the app and publishes it to https://<owner>.github.io/sat-vocab/.
#
# One-time setup: in the repository, open Settings > Pages and set
# "Source" to "GitHub Actions". Until that is done this workflow fails at the
# "configure-pages" step. After turning Pages on, run it once by hand from the
# Actions tab (Deploy to GitHub Pages > Run workflow) or push any commit.
#
# It deploys only from the repository's default branch.
on:
  push:
    branches:
      - main
      - claude/quirky-ride-vnzfx2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the word list
        run: npm run validate -- --complete --min=1000
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
