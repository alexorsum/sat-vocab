name: CI

# Runs on every push and pull request: word list validation, unit tests,
# a production build, and the end-to-end tests at phone and laptop sizes.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the word list
        run: npm run validate -- --complete --min=1000
      - name: Check definitions against WordNet
        run: npm run check:wordnet -- --strict
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (fails if word validation fails)
        run: npm run build
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
