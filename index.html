<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Study 1,000+ Digital SAT words with spaced review and Words in Context practice. Works offline." />
    <meta name="theme-color" content="#184f95" />
    <link rel="icon" type="image/svg+xml" href="/sat-vocab/favicon.svg" />
    <link rel="apple-touch-icon" href="/sat-vocab/icons/apple-touch-icon.png" />
    <title>SAT Vocab</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('sat-vocab-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
